  --bg:#0E1412; --surface:#17201C; --sunk:#1E2824; --ink:#E3EAE6; --muted:#98A7A0; --line:#2C3833;
  --accent:#4DBF9C; --accent-ink:#0A1210; --accent-soft:#1D3A31;
  --bad:#EE7A6F; --bad-soft:#3A1F1C; --good:#6FCF95; --good-soft:#1B3325;
  --t1:#F07B6B; --t2:#E7B04E; --t3:#6CCB8D; --t4:#7FA6F0; --t5:#8E9A95;
  --m0:#17201C; --m1:#4A3F1F; --m2:#1F4A3C; --m3:#4DBF9C; --m3-ink:#0A1210;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.hz{font-family:var(--hz);font-weight:500}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .seal{font-family:var(--hz);font-weight:700;font-size:20px;background:var(--accent);color:var(--accent-ink);width:34px;height:34px;display:grid;place-items:center;border-radius:8px;flex:none;align-self:center}
.brand h1{font-size:19px;margin:0;letter-spacing:.01em}
.brand .stat{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.tiers button{border:0;background:transparent;border-radius:9px;padding:7px 4px;display:grid;gap:0;line-height:1.2}
.tiers button b{font-size:15px}
.tiers button span{font-size:11.5px;color:var(--muted)}
.tiers button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;padding:9px 0 10px;display:grid;justify-items:center;gap:1px;font-size:12px;color:var(--muted)}
nav button .hz{font-size:21px;line-height:1.1}
nav button[aria-current="page"]{color:var(--accent)}
nav button[aria-current="page"] span{font-weight:700}
section{display:grid;gap:16px;padding-top:6px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 -6px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13.5px}
/* card */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:18px 18px 16px;display:grid;gap:12px;min-height:310px;align-content:start;position:relative}
.card .meta{padding-right:44px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.big{font-family:var(--hz);font-weight:500;font-size:clamp(96px,32vw,132px);line-height:1;text-align:center;padding-block:8px 4px;user-select:none}
.reveal{border:1px dashed var(--line);background:var(--bg);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:15px}
.info{display:grid;gap:8px;text-align:center}
.py{font-size:26px;font-weight:600;letter-spacing:.02em}

.tone1{color:var(--t1)}.tone2{color:var(--t2)}.tone3{color:var(--t3)}.tone4{color:var(--t4)}.tone5{color:var(--t5)}
.mean{font-size:18px}
.ex{display:flex;justify-content:center;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:10px;padding:10px 12px}
.ex .hz{font-size:24px}
.ex .p{font-size:14px}
.ex .d{font-size:14.5px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 10px;font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.speak{position:absolute;top:12px;right:12px;border:0;background:var(--sunk);border-radius:999px;width:36px;height:36px;display:grid;place-items:center}
.speak svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* grid */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.grid button{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:8px;font-family:var(--hz);font-size:22px;padding:0;display:grid;place-items:center;background:var(--m0)}
.grid button.b1{background:var(--m1);border-color:transparent}
.grid button.b2{background:var(--m2);border-color:transparent}
.grid button.b3{background:var(--m3);color:var(--m3-ink);border-color:transparent}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
/* quiz */
.q-prompt{text-align:center;display:grid;gap:6px;padding-block:6px}
.q-prompt .big{font-size:clamp(84px,28vw,116px)}
.q-prompt .word{font-size:21px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;font-size:17px;display:flex;align-items:center;gap:10px;min-height:52px}
.opt.hzopt{justify-content:center;font-family:var(--hz);font-size:36px;padding:6px}
.opts.hzgrid{grid-template-columns:1fr 1fr}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.feedback{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{font-size:15px}
.score{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.miss button{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--hz);font-size:26px;width:48px;height:48px}
/* reading */
.tlist{display:grid;gap:8px}
.titem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.titem .hz{font-size:22px;flex:none;width:3.1em;overflow:hidden;white-space:nowrap;color:var(--muted)}
.titem .tt{display:grid;flex:1;min-width:0}
.titem .tt b{font-size:16px}
.titem .tt span{font-size:13px;color:var(--muted)}
.lock{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 8px;flex:none}
.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;display:grid;gap:14px}
.passage{font-family:var(--hz);font-size:27px;line-height:2.15;word-break:break-all}
.passage ruby{ruby-position:over}
.passage rt{font-family:var(--ui);font-size:11.5px;font-weight:600;letter-spacing:0}
.passage.nopy rt{visibility:hidden}
.passage .c{cursor:pointer;border-radius:4px}
.passage .c.unk{background:var(--m1)}
.passage .c.on{background:var(--accent-soft);outline:1px solid var(--accent)}
.transl{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:15.5px}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;justify-self:start}
/* signs */
.sign{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.sign .board{grid-row:span 2;font-family:var(--hz);font-weight:700;font-size:24px;background:#B3342B;color:#FBE9C8;border-radius:6px;padding:4px 10px;letter-spacing:.06em;white-space:nowrap}
.sign .board span{cursor:pointer}
.sign .board span.x{text-decoration:underline dotted 2px;text-underline-offset:5px}
.sign .de{font-weight:600}
.sign .sp{font-size:14px}
.sign .note{grid-column:1/-1;font-size:13px;color:var(--muted)}
@media (max-width:380px){.sign{grid-template-columns:1fr}.sign .board{grid-row:auto;justify-self:start}}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;display:grid;gap:12px;box-shadow:0 -6px 30px rgba(0,0,0,.18)}
.sheet .top{display:flex;gap:16px;align-items:center}
.sheet .top .hz{font-size:72px;line-height:1}
.sheet .top .py{font-size:22px}
.sheet .tag{font-size:12.5px;color:var(--muted)}
.note-box{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

o", "", "wǒ", "shì", "xué", "shēng", "", "tā", "yě", "shì", "xué", "shēng", "", "wǒ", "men", "dōu", "zài", "dà", "xué", "", "wǒ", "men", "shì", "tóng", "xué", "", "tā", "shuō", "", "", "nǐ", "hǎo", "", "", "wǒ", "shuō", "", "", "nǐ", "hǎo", "", ""]}, {"t": 1, "title": "Rausgehen", "zh": "天好了，我不想在家，我要出去看看。他说：“你要去这里还是那里？”我说：“我还没想好。”他说：“那我们一起去！”", "de": "Das Wetter ist gut geworden, ich will nicht zu Hause bleiben, ich will raus und mich umsehen. Er sagt: „Willst du hierhin oder dorthin?“ Ich sage: „Ich habe mich noch nicht entschieden.“ Er sagt: „Dann gehen wir zusammen!“", "py": ["tiān", "hǎo", "le", "", "wǒ", "bù", "xiǎng", "zài", "jiā", "", "wǒ", "yào", "chū", "qù", "kàn", "kàn", "", "tā", "shuō", "", "", "nǐ", "yào", "qù", "zhè", "lǐ", "hái", "shì", "nà", "lǐ", "", "", "wǒ", "shuō", "", "", "wǒ", "hái", "méi", "xiǎng", "hǎo", "", "", "tā", "shuō", "", "", "nà", "wǒ", "men", "yì", "qǐ", "qù", "", ""]}, {"t": 1, "title": "China", "zh": "中国是一个大国，人多，地方也大。我有一个中国同学，他从中国来。他说：“你也要去中国看看！”我说：“好，我一定去！”", "de": "China ist ein großes Land, mit vielen Menschen und viel Fläche. Ich habe einen chinesischen Mitstudenten, er kommt aus China. Er sagt: „Du musst auch mal nach China!“ Ich sage: „Gut, ich fahre bestimmt hin!“", "py": ["zhōng", "guó", "shì", "yí", "gè", "dà", "guó", "", "rén", "duō", "", "dì", "fāng", "yě", "dà", "", "wǒ", "yǒu", "yí", "gè", "zhōng", "guó", "tóng", "xué", "", "tā", "cóng", "zhōng", "guó", "lái", "", "tā", "shuō", "", "", "nǐ", "yě", "yào", "qù", "zhōng", "guó", "kàn", "kàn", "", "", "wǒ", "shuō", "", "", "hǎo", "", "wǒ", "yí", "dìng", "qù", "", ""]}, {"t": 2, "title": "Im Restaurant", "zh": "我们三个人去饭店吃饭。门口的人问：“几位？”我说：“三位。”我们坐下看菜单。我要米饭和两个菜，还要一些茶。菜很好吃！吃完了，我说：“买单！”一共九十八块。", "de": "Wir gehen zu dritt essen. Am Eingang fragt jemand: „Wie viele Personen?“ Ich sage: „Drei.“ Wir setzen uns und schauen in die Speisekarte. Ich nehme Reis und zwei Gerichte und dazu etwas Tee. Das Essen ist sehr lecker! Danach sage ich: „Die Rechnung, bitte!“ Zusammen 98 Yuan.", "py const CH = DATA.chars;
const BYC = Object.fromEntries(CH.map((c,i)=>[c.c,Object.assign(c,{i})]));
const TIERINFO = {1:"Die 100 häufigsten",2:"Die 300 wichtigsten",3:"Grundwortschatz 500"};
const KEY="hanzi-leiter-v1";
let S = {tier:1, view:"learn", box:{}, qmode:"mean"};
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) S=Object.assign(S,s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const box=c=>S.box[c]||0;
function setBox(c,v){ S.box[c]=Math.max(0,Math.min(3,v)); save(); updateHead(); }
const tierChars=t=>CH.filter(c=>c.t===t);
const isHz=ch=>/[㐀-鿿]/.test(ch);

function toneOf(s){ if(/[āēīōūǖĀĒĪŌŪ]/.test(s))return 1; if(/[áéíóúǘÁÉÍÓÚ]/.test(s))return 2; if(/[ǎěǐǒǔǚǍĚǏǑǓ]/.test(s))return 3; if(/[àèìòùǜÀÈÌÒÙ]/.test(s))return 4; return 5; }
function pyHTML(p){ return p.split(/\s+/).map(s=>`<span class="tone${toneOf(s)}">${esc(s)}</span>`).join(" "); }
function mainPy(p){ return p; }

/* speech */
let zhVoice=null;
const canSpeak="speechSynthesis" in window;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); zhVoice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null; }catch(e){} }
if(canSpeak){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function speak(t){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="zh-CN"; if(zhVoice) u.voice=zhVoice; u.rate=.8; speechSynthesis.speak(u);}catch(e){} }
const SPK=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;

/* header */
function updateHead(){
  const tc=tierChars(S.tier), known=tc.filter(c=>box(c.c)===3).length;
  const all=CH.filter(c=>box(c.c)===3).length;
  $("#stat").textContent=`${known}/${tc.length} sicher · ${all} gesamt`;
  $("#barfill").style.width=(known/tc.length*100)+"%";
  document.querySelectorAll(".tiers button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.tier===S.tier)));
  document.querySelectorAll("nav button").forEach(b=>{ if(b.dataset.view===S.view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
}
document.querySelectorAll(".tiers button").forEach(b=>b.onclick=()=>{ S.tier=+b.dataset.tier; save(); L.queue=null; Q.run=null; render(); });
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ S.view=b.dataset.view; save(); R.open=null; render(); window.scrollTo(0,0); });

/* sheet */
function openSheet(ch, extraNote){
  const c=BYC[ch], ex=DATA.extra[ch];
  let body;
  if(c){
    body=`<div class="top"><span class="hz">${esc(c.c)}</span><div style="display:grid;gap:2px">
      <span class="py">${pyHTML(c.p)}</span><span class="mean">${esc(c.d)}</span>
      <span class="tag">Stufe ${c.t} · Nr. ${c.i+1}</span></div></div>
      <div class="ex"><span class="hz">${esc(c.w)}</span><span class="p">${pyHTML(c.wp)}</span><span class="d">${esc(c.wd)}</span></div>
      <div class="row">
        <button class="btn ${box(c.c)===3?'':'good'}" id="sh-know">${box(c.c)===3?'Wieder üben':'Kann ich schon'}</button>
        <button class="btn ghost" id="sh-close">Schließen</button>
      </div>`;
  } else if(ex){
    body=`<div class="top"><span class="hz">${esc(ch)}</span><div style="display:grid;gap:2px">
      <span class="py">${pyHTML(ex.p)}</span><span class="mean">${esc(ex.d)}</span>
      <span class="tag">nicht in deinen 500 Zeichen</span></div></div>
      <button class="btn ghost" id="sh-close">Schließen</button>`;
  } else return;
  $("#sheetRoot").innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Zeichen ${esc(ch)}">${body}${canSpeak?`<button class="speak" id="sh-speak" aria-label="Aussprache">${SPK}</button>`:''}</div>`;
  const close=()=>{$("#sheetRoot").innerHTML=""; if(S.view==="learn") render();};
  $("#scrim").onclick=close; $("#sh-close").onclick=close;
  const k=$("#sh-know"); if(k) k.onclick=()=>{ setBox(ch, box(ch)===3?0:3); close(); };
  const sp=$("#sh-speak"); if(sp) sp.onclick=()=>speak(c?c.c:ch);
}

/* LEARN */
const L={queue:null,idx:0,shown:false,done:0,filter:"open"};
function buildQueue(){
  let tc=tierChars(S.tier);
  if(L.filter==="open") tc=tc.filter(c=>box(c.c)<3);
  tc=tc.slice().sort((a,b)=>box(a.c)-box(b.c)||a.i-b.i);
  L.queue=tc.map(c=>c.c); L.shown=false; L.done=0;
}
function renderLearn(){
  if(!L.queue) buildQueue();
  const v=$("#view");
  const cur=L.queue[0];
  let card;
  if(!cur){
    card=`<div class="card" style="min-height:0;text-align:center;gap:14px">
      <div class="big" style="font-size:72px">好</div>
      <div><b>Stufe ${S.tier} ist durch.</b><div class="muted small">Alle Zeichen dieser Stufe sind als sicher markiert.</div></div>
      <div class="row"><button class="btn" id="l-all">Alle wiederholen</button><button class="btn primary" id="l-next" ${S.tier===3?'disabled':''}>Nächste Stufe</button></div></div>`;
  } else {
    const c=BYC[cur];
    card=`<div class="card">
      <div class="meta"><span>Nr. ${c.i+1} · ${["neu","1× gewusst","2× gewusst","sicher"][box(c.c)]}</span><span>noch ${L.queue.length}</span></div>
      ${canSpeak?`<button class="speak" id="l-speak" aria-label="Aussprache anhören">${SPK}</button>`:''}
      <div class="big" id="l-big" role="button" tabindex="0" aria-label="Karte aufdecken">${esc(c.c)}</div>
      ${L.shown?`<div class="info"><div class="py">${pyHTML(c.p)}</div><div class="mean">${esc(c.d)}</div>
        <div class="ex"><span class="hz">${esc(c.w)}</span><span class="p">${pyHTML(c.wp)}</span><span class="d">${esc(c.wd)}</span></div></div>
        <div class="row"><button class="btn bad" id="l-again">Nochmal</button><button class="btn good" id="l-know">Kann ich</button></div>`
      :`<button class="reveal" id="l-show">Tippen zum Aufdecken</button>`}
    </div>`;
  }
  const tc=tierChars(S.tier);
  v.innerHTML=`<section>
    ${card}
    <div class="tools">
      <button class="chip" id="f-open" aria-pressed="${L.filter==='open'}">Nur offene</button>
      <button class="chip" id="f-all" aria-pressed="${L.filter==='all'}">Alle der Stufe</button>
    </div>
    <h2>${esc(TIERINFO[S.tier])}</h2>
    <div class="legend"><span><i style="background:var(--m0)"></i>neu</span><span><i style="background:var(--m1)"></i>1×</span><span><i style="background:var(--m2)"></i>2×</span><span><i style="background:var(--m3)"></i>sicher</span></div>
    <div class="grid">${tc.map(c=>`<button class="b${box(c.c)}" data-c="${esc(c.c)}" aria-label="${esc(c.c)}">${esc(c.c)}</button>`).join("")}</div>
    <p class="muted small" style="margin:0">Tippe ein Zeichen an, um es nachzuschlagen oder als bekannt zu markieren. Die Reihenfolge folgt grob der Häufigkeit, ergänzt um Alltagszeichen für Speisekarten, Schilder und Reisen.</p>
  </section>`;
  const reveal=()=>{ if(!L.shown){ L.shown=true; renderLearn(); } };
  const big=$("#l-big"); if(big){ big.onclick=reveal; big.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();reveal();} }; }
  const sh=$("#l-show"); if(sh) sh.onclick=reveal;
  const sp=$("#l-speak"); if(sp) sp.onclick=e=>{ e.stopPropagation(); speak(cur); };
  const ag=$("#l-again"); if(ag) ag.onclick=()=>{ setBox(cur,0); L.queue.shift(); L.queue.splice(Math.min(3,L.queue.length),0,cur); L.shown=false; renderLearn(); };
  const kn=$("#l-know"); if(kn) kn.onclick=()=>{ setBox(cur,box(cur)+1); L.queue.shift(); if(box(cur)<3 && L.filter==="open") L.queue.splice(Math.min(8,L.queue.length),0,cur); L.shown=false; renderLearn(); };
  const la=$("#l-all"); if(la) la.onclick=()=>{ L.filter="all"; buildQueue(); renderLearn(); };
  const ln=$("#l-next"); if(ln) ln.onclick=()=>{ S.tier=Math.min(3,S.tier+1); save(); L.queue=null; render(); };
  $("#f-open").onclick=()=>{ L.filter="open"; buildQueue(); renderLearn(); };
  $("#f-all").onclick=()=>{ L.filter="all"; buildQueue(); renderLearn(); };
  v.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>openSheet(b.dataset.c));
}

/* QUIZ */
const Q={run:null};
const QMODES={mean:"Zeichen → Bedeutung",py:"Zeichen → Pinyin",hz:"Bedeutung → Zeichen"};
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function newQuiz(){
  const tc=tierChars(S.tier);
  // prefer characters that are not yet mastered
  const weak=shuffle(tc.filter(c=>box(c.c)<3)), strong=shuffle(tc.filter(c=>box(c.c)===3));
  const pick=weak.concat(strong).slice(0,10);
  const key=S.qmode==="py"?"p":S.qmode==="mean"?"d":"c";
  Q.run={n:0,score:0,wrong:[],items:shuffle(pick).map(c=>{
    const pool=shuffle(tc.filter(o=>o.c!==c.c && o[key]!==c[key]));
    const opts=[c]; for(const o of pool){ if(opts.length>=4)break; if(!opts.some(x=>x[key]===o[key])) opts.push(o); }
    return {c:c.c,opts:shuffle(opts).map(o=>o.c),ans:null};
  })};
}
function renderQuiz(){
  if(!Q.run) newQuiz();
  const v=$("#view"), r=Q.run;
  const chips=`<div class="tools">${Object.entries(QMODES).map(([k,l])=>`<button class="chip" data-q="${k}" aria-pressed="${S.qmode===k}">${l}</button>`).join("")}</div>`;
  if(r.n>=r.items.length){
    v.innerHTML=`<section>${chips}<div class="card" style="min-height:0;text-align:center;gap:14px">
      <div class="score">${r.score}<span class="muted" style="font-size:26px">/${r.items.length}</span></div>
      <div>${r.score===r.items.length?"Alles richtig.":r.score>=7?"Gut gemacht.":"Die falschen Zeichen kommen beim Lernen wieder nach vorn."}</div>
      ${r.wrong.length?`<div class="muted small">Nochmal anschauen:</div><div class="miss">${r.wrong.map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>`:""}
      <button class="btn primary" id="q-again">Neue Runde</button></div></section>`;
    $("#q-again").onclick=()=>{ newQuiz(); renderQuiz(); };
    v.querySelectorAll(".miss button").forEach(b=>b.onclick=()=>openSheet(b.dataset.c));
    bindChips(); return;
  }
  const it=r.items[r.n], c=BYC[it.c], m=S.qmode;
  const prompt = m==="hz" ? `<div class="word">${esc(c.d)}</div><div class="muted small">Welches Zeichen passt?</div>`
                          : `<div class="big">${esc(c.c)}</div>`;
  const optLabel=o=>m==="mean"?esc(BYC[o].d):m==="py"?`<span class="py" style="font-size:20px">${pyHTML(BYC[o].p)}</span>`:esc(o);
  const optsHTML=it.opts.map((o,k)=>{
    let cls="opt"+(m==="hz"?" hzopt":"");
    if(it.ans!==null){ if(o===it.c) cls+=" right"; else if(o===it.ans) cls+=" wrong"; }
    return `<button id="opt${k}" class="${cls}" data-o="${esc(o)}" ${it.ans!==null?"disabled":""}>${optLabel(o)}</button>`;
  }).join("");
  let fb="";
  if(it.ans!==null){
    const ok=it.ans===it.c;
    fb=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'Richtig':'Nicht ganz'}</b>
      <div><span class="hz" style="font-size:22px">${esc(c.c)}</span> <span class="py" style="font-size:17px">${pyHTML(c.p)}</span> · ${esc(c.d)}</div>
      <div class="small muted"><span class="hz">${esc(c.w)}</span> ${esc(c.wp)} · ${esc(c.wd)}</div></div>
      <button class="btn primary" id="q-next">${r.n+1<r.items.length?'Weiter':'Ergebnis'}</button>`;
  }
  v.innerHTML=`<section>${chips}
    <div class="card" style="min-height:0">
      <div class="meta"><span>Frage ${r.n+1} von ${r.items.length}</span><span>${r.score} richtig</span></div>
      ${canSpeak&&m!=="hz"?`<button class="speak" id="q-speak" aria-label="Aussprache anhören">${SPK}</button>`:''}
      <div class="q-prompt">${prompt}</div>
      <div class="opts ${m==='hz'?'hzgrid':''}">${optsHTML}</div>
      ${fb}
    </div></section>`;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(it.ans!==null) return;
    it.ans=b.dataset.o;
    if(it.ans===it.c){ r.score++; setBox(it.c,box(it.c)+1); } else { r.wrong.push(it.c); setBox(it.c,0); }
    renderQuiz();
  });
  const nx=$("#q-next"); if(nx){ nx.onclick=()=>{ r.n++; renderQuiz(); }; nx.focus({preventScroll:true}); }
  const sp=$("#q-speak"); if(sp) sp.onclick=()=>speak(c.c);
  bindChips();
}
function bindChips(){ document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ S.qmode=b.dataset.q; save(); newQuiz(); renderQuiz(); }); }

/* READ */
const R={open:null,py:true,tr:false,sel:-1};
function renderRead(){
  const v=$("#view");
  if(R.open===null){
    const groups=[1,2,3].map(t=>{
      const items=DATA.texts.map((x,i)=>[x,i]).filter(([x])=>x.t===t);
      return `<h2>Mit Stufe ${t} lesbar</h2><div class="tlist">${items.map(([x,i])=>`
        <button class="titem" data-i="${i}"><span class="hz">${esc(x.zh.slice(0,3))}</span>
        <span class="tt"><b>${esc(x.title)}</b><span>${x.zh.replace(/[^㐀-鿿]/g,"").length} Zeichen</span></span>
        ${t>S.tier?`<span class="lock">ab Stufe ${t}</span>`:""}</button>`).join("")}</div>`;
    }).join("");
    v.innerHTML=`<section><p class="muted small" style="margin:0">Jeder Text nutzt nur Zeichen bis zu seiner Stufe. Zeichen, die du noch nicht als sicher markiert hast, sind gelb hinterlegt. Tippe ein Zeichen an, um es nachzuschlagen.</p>${groups}</section>`;
    v.querySelectorAll(".titem").forEach(b=>b.onclick=()=>{ R.open=+b.dataset.i; R.tr=false; R.sel=-1; renderRead(); window.scrollTo(0,0); });
    return;
  }
  const x=DATA.texts[R.open];
  const chars=[...x.zh];
  const html=chars.map((ch,i)=>{
    if(!isHz(ch)) return esc(ch);
    const unk=box(ch)<3?" unk":"";
    return `<ruby class="c${unk}${R.sel===i?' on':''}" data-i="${i}" data-c="${esc(ch)}">${esc(ch)}<rt class="tone${toneOf(x.py[i])}">${esc(x.py[i])}</rt></ruby>`;
  }).join("");
  v.innerHTML=`<section>
    <button class="back" id="r-back">‹ Alle Texte</button>
    <div class="reader">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="font-size:18px">${esc(x.title)}</b>
        <div class="tools">
          <button class="chip" id="r-py" aria-pressed="${R.py}">Pinyin</button>
          ${canSpeak?`<button class="chip" id="r-say">Vorlesen</button>`:''}
        </div>
      </div>
      <div class="passage ${R.py?'':'nopy'}">${html}</div>
      ${R.tr?`<div class="transl">${esc(x.de)}</div>`:`<button class="btn" id="r-tr">Übersetzung zeigen</button>`}
    </div></section>`;
  $("#r-back").onclick=()=>{ R.open=null; renderRead(); };
  $("#r-py").onclick=()=>{ R.py=!R.py; renderRead(); };
  const tr=$("#r-tr"); if(tr) tr.onclick=()=>{ R.tr=true; renderRead(); };
  const say=$("#r-say"); if(say) say.onclick=()=>speak(x.zh);
  v.querySelectorAll(".passage .c").forEach(el=>el.onclick=()=>{ R.sel=+el.dataset.i; openSheet(el.dataset.c); renderReadMarks(); });
}
function renderReadMarks(){ document.querySelectorAll(".passage .c").forEach(el=>el.classList.toggle("on",+el.dataset.i===R.sel)); }

/* SIGNS */
function renderSigns(){
  const v=$("#view");
  v.innerHTML=`<section>
    <p class="muted small" style="margin:0">Typische chinesische Schilder in Laos. Tippe ein Zeichen an. Gepunktet unterstrichene Zeichen gehören nicht zu deinen 500.</p>
    ${DATA.signs.map(s=>`<div class="sign">
      <div class="board">${[...s.zh].map(ch=>`<span class="${BYC[ch]?'':'x'}" data-c="${esc(ch)}">${esc(ch)}</span>`).join("")}</div>
      <div class="de">${esc(s.de)}</div>
      <div class="sp">${pyHTML(s.p)}</div>
      ${s.note?`<div class="note">${esc(s.note)}</div>`:''}
    </div>`).join("")}
  </section>`;
  v.querySelectorAll(".board span").forEach(el=>el.onclick=()=>openSheet(el.dataset.c));
}

function render(){
  updateHead();
  ({learn:renderLearn,quiz:renderQuiz,read:renderRead,signs:renderSigns})[S.view]();
}
render();
</script>
